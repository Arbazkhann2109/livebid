# Production database connection ? supply these as environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Database migrations
spring.flyway.enabled=true

# Production logging
logging.level.com.livebid=INFO
logging.level.org.springframework.web=WARN

# Do not expose detailed health information publicly
management.endpoint.health.show-details=never

# Render web server configuration
server.port=${PORT:8080}
server.address=0.0.0.0


# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}

app.frontend.base-url=${APP_BASE_URL:https://livebid-h02l.onrender.com}

app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}