
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | LiveBid</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0b1120;
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #28354a;
            border-radius: 18px;
            background: #151e30;
        }

        .logo {
            color: #f8fafc;
            font-size: 1.8rem;
            font-weight: 800;
            text-decoration: none;
        }

        .logo span { color: #38bdf8; }

        h1 { margin-top: 28px; }

        .muted { color: #9ca3b8; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #39475d;
            border-radius: 9px;
            background: #0b1120;
            color: #f8fafc;
            font-size: 1rem;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #38bdf8;
            color: #082032;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #451a24;
            color: #fecdd3;
        }

        .field-error {
            display: block;
            margin-top: 5px;
            color: #fca5a5;
            font-size: .9rem;
        }

        .bottom {
            margin-top: 22px;
            text-align: center;
            color: #9ca3b8;
        }

        a { color: #38bdf8; }
    </style>
</head>
<body>
<main class="card">
    <a class="logo" th:href="@{/}">Live<span>Bid</span></a>

    <h1>Create your account</h1>
    <p class="muted">Join LiveBid and discover your next great find.</p>

    <div class="error"
         th:if="${registrationError}"
         th:text="${registrationError}"
         role="alert"></div>

    <form th:action="@{/register}"
          th:object="${registration}"
          method="post">

        <label for="displayName">Display name</label>
        <input id="displayName"
               type="text"
               th:field="*{displayName}"
               maxlength="100"
               autocomplete="name"
               required>
        <span class="field-error"
              th:if="${#fields.hasErrors('displayName')}"
              th:errors="*{displayName}"></span>

        <label for="email">Email address</label>
        <input id="email"
               type="email"
               th:field="*{email}"
               maxlength="254"
               autocomplete="email"
               required>
        <span class="field-error"
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               th:field="*{password}"
               autocomplete="new-password"
               required>
        <span class="field-error"
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"></span>

        <button type="submit">Create account</button>
    </form>

    <p class="bottom">
        Already registered?
        <a th:href="@{/login}">Log in</a>
    </p>
</main>
</body>
</html>
