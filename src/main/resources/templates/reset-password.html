
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Reset Password | LiveBid</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #080d19;
            color: #f4f7ff;
            font-family: 'DM Sans', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #101827;
            border: 1px solid rgba(148,163,184,.14);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 27px;
            font-weight: 700;
            color: #55a8ff;
            text-decoration: none;
        }

        h1 {
            margin: 30px 0 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 22px 0 9px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080d19;
            border: 1px solid rgba(148,163,184,.2);
            border-radius: 10px;
            color: #f4f7ff;
            font: inherit;
            outline: none;
        }

        input:focus { border-color: #55a8ff; }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #55a8ff;
            color: #080d19;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover { background: #79bdff; }

        .error {
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            background: rgba(248,113,113,.1);
            color: #f87171;
            font-size: 13px;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #55a8ff;
            text-decoration: none;
            font-size: 14px;
        }

        @media(max-width:480px) {
            .card { padding: 28px 22px; }
        }
    </style>
</head>

<body>
<div class="card">

    <a th:href="@{/}" class="logo">LiveBid.</a>

    <h1>Reset password</h1>

    <p>Create a new password for your LiveBid account.</p>

    <div class="error"
         th:if="${resetError}"
         th:text="${resetError}">
    </div>

    <form th:action="@{/reset-password}" method="post">

        <input type="hidden" name="token" th:value="${token}">

        <label for="password">New password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password">

        <label for="confirmPassword">Confirm new password</label>

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password">

        <button type="submit">Update Password</button>

    </form>

    <a th:href="@{/login}" class="back">Back to Login</a>

</div>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            event.preventDefault();
            alert("Passwords do not match.");
        }
    });
</script>

</body>
</html>
