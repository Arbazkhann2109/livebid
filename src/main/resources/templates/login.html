
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1120">
    <title>Log in | LiveBid</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0b1120;
            color: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 34px;
            border: 1px solid #28354a;
            border-radius: 18px;
            background: #151e30;
        }

        .logo {
            color: #f8fafc;
            font-size: 1.8rem;
            font-weight: 800;
            text-decoration: none;
        }

        .logo span { color: #38bdf8; }

        h1 { margin: 28px 0 8px; }

        .muted {
            margin-bottom: 26px;
            color: #9ca3b8;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #39475d;
            border-radius: 9px;
            background: #0b1120;
            color: #f8fafc;
            font-size: 1rem;
        }

        input:focus {
            outline: 2px solid #38bdf8;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #38bdf8;
            color: #082032;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .error {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #451a24;
            color: #fecdd3;
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            color: #38bdf8;
            text-decoration: none;
        }

        .register {
            margin-top: 20px;
            text-align: center;
            color: #9ca3b8;
        }

        a { color: #38bdf8; }

        @media (max-width: 480px) {
            .login-card { padding: 24px; }
        }
    </style>
</head>
<body>
<main class="login-card">
    <a class="logo" th:href="@{/}">Live<span>Bid</span></a>

    <h1>Welcome back</h1>
    <p class="muted">Log in to your account to continue bidding.</p>

    <div class="error"
         th:if="${loginError}"
         th:text="${loginError}"
         role="alert">
        Invalid email or password.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email address</label>
        <input id="email"
               name="email"
               type="email"
               autocomplete="username"
               maxlength="254"
               required
               autofocus>

        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>

        <button type="submit">Log in</button>
    </form>

    <p class="register">
        Don't have an account?
        <a th:href="@{/register}">Register</a>
    </p>

    <a class="back" th:href="@{/}">← Back to LiveBid</a>
</main>
</body>
</html>
