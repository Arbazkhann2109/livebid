spring.application.name=livebid

server.port=8080

# Activate the development profile
spring.profiles.active=dev

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application timezone
spring.jackson.time-zone=Asia/Kolkata

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}
app.frontend.base-url=http://localhost:8080

# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}